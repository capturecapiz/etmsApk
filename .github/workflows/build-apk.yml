name: Build Android APK

# Builds a real, installable .apk entirely on GitHub's own servers — no
# Flutter/Android Studio install needed on your PC. Push this project to a
# GitHub repo (free account is fine) and this runs automatically; download
# the APK from the finished run's "Artifacts" section.
on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: edmate-staff-app
          path: build/app/outputs/flutter-apk/app-release.apk
