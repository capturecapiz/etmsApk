name: edmate_mobile
description: PTCAO ETMS - Employee (edmate) mobile app for staff.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.1
  shared_preferences: ^2.2.2
  intl: ^0.19.0
  provider: ^6.1.2
  flutter_secure_storage: ^9.2.2
  cached_network_image: ^3.3.1
  url_launcher: ^6.2.5
  percent_indicator: ^4.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
